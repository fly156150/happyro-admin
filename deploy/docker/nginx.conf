worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not log query strings, cookies or authorization headers.
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout safe;
    server_tokens off;
    sendfile on;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control no-cache always;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }
        location ~ ^/api(?:/|$) {
            # Resolve on requests so an API container replacement is picked up.
            set $api_backend api:8080;
            proxy_pass http://$api_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_cache off;
            proxy_next_upstream off;
        }
        location ~ /\. { return 404; }
        location ~ \.[^/]+$ { try_files $uri =404; }
        location / { try_files $uri/index.html $uri /index.html; }
    }
}
